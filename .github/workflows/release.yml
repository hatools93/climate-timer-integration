name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.4.0 — without 'v' prefix)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build frontend card
        run: npm run build

      - name: Update manifest version
        run: |
          jq '.version = "${{ inputs.version }}"' \
            custom_components/climate_timer/manifest.json > tmp.json \
            && mv tmp.json custom_components/climate_timer/manifest.json

      - name: Commit release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/climate_timer/manifest.json
          git add custom_components/climate_timer/frontend/climate-timer-integration-card.js
          git diff --cached --quiet || git commit -m "chore: release v${{ inputs.version }}"
          git push origin main

      - name: Create and push tag
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Package custom component
        run: |
          cd custom_components/climate_timer
          zip -r ../../climate-timer-${{ inputs.version }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          files: climate-timer-${{ inputs.version }}.zip
